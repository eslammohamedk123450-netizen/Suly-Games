<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#d8d2c5" />
    <title>Suly City</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      #tool-toolbar {
        position: fixed;
        z-index: 5;
        left: 50%;
        bottom: max(10px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
        width: min(390px, calc(100vw - 24px));
        padding: 5px;
        transform: translateX(-50%);
        border: 1px solid rgba(38, 66, 38, 0.2);
        border-radius: 18px;
        background: rgba(248, 253, 245, 0.62);
        box-shadow: 0 6px 22px rgba(23, 45, 23, 0.18);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .tool-button {
        min-width: 0;
        min-height: 38px;
        padding: 0 6px;
        border: 1px solid rgba(47, 68, 48, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.48);
        color: #344636;
        font: 600 12px/1.2 system-ui, sans-serif;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .tool-button.is-active {
        border-color: #356f42;
        background: #356f42;
        color: #fff;
        box-shadow: 0 3px 9px rgba(28, 83, 43, 0.24);
      }
      .tool-button:disabled {
        opacity: 0.48;
      }
      .tool-button:focus-visible {
        outline: 3px solid #356b3b;
        outline-offset: 2px;
      }
      #building-bubbles {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        overflow: hidden;
      }
      .building-bubble {
        position: absolute;
        min-width: 78px;
        padding: 5px 9px;
        transform: translate(-50%, -100%);
        border: 2px solid #2f80ed;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 3px 10px rgba(24, 59, 102, 0.25);
        color: #245a9a;
        font: 700 11px/1.1 system-ui, sans-serif;
        text-align: center;
        white-space: nowrap;
      }
      .building-bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -6px;
        width: 10px;
        height: 10px;
        border-right: 2px solid #2f80ed;
        border-bottom: 2px solid #2f80ed;
        background: #fff;
        transform: translateX(-50%) rotate(45deg);
      }
      @media (max-width: 370px) {
        #tool-toolbar { gap: 3px; padding: 4px; }
        .tool-button { min-height: 34px; padding-inline: 3px; font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Suly City isometric city builder"></canvas>
    <div id="building-bubbles" aria-hidden="true"></div>
    <nav id="tool-toolbar" aria-label="City placement tools" dir="ltr">
      <button id="tool-road" class="tool-button is-active" type="button" data-tool="ROAD" aria-pressed="true">Road</button>
      <button id="tool-house" class="tool-button" type="button" data-tool="HOUSE" aria-pressed="false" disabled>House</button>
      <button id="tool-shop" class="tool-button" type="button" data-tool="SHOP" aria-pressed="false" disabled>Shop</button>
      <button id="tool-skyscraper" class="tool-button" type="button" data-tool="SKYSCRAPER" aria-pressed="false" disabled>Skyscraper</button>
    </nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
